<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Focus Clock helps you visualize your goals and plan the day around them.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Focus Clock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    #focus-clock-loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: #17171c;
      color: #e8dfcf;
      font: 500 13px/1.4 system-ui, sans-serif;
    }

    #focus-clock-loading-mark {
      width: 24px;
      height: 24px;
      border: 1.5px solid #ffffff30;
      border-top-color: #e7c27d;
      border-radius: 50%;
      animation: focus-clock-turn 1.2s linear infinite;
    }

    #focus-clock-retry {
      padding: 8px 14px;
      border: 1px solid #e7c27d80;
      border-radius: 999px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    @keyframes focus-clock-turn {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #focus-clock-loading-mark { animation: none; }
    }
  </style>

  <!-- Google Sign In Web Client ID -->
  <meta name="google-signin-client_id" content="607666586504-2somn7b2p1mrfbflls09st7ovh1hi9r8.apps.googleusercontent.com">

  <title>Focus Clock</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="focus-clock-loading" role="status" aria-live="polite">
    <span id="focus-clock-loading-mark" aria-hidden="true"></span>
    <span id="focus-clock-loading-copy">Membuka Focus Clock…</span>
    <button id="focus-clock-retry" type="button" hidden>Coba lagi</button>
  </div>
  <script>
    (() => {
      const loading = document.getElementById('focus-clock-loading');
      const copy = document.getElementById('focus-clock-loading-copy');
      const mark = document.getElementById('focus-clock-loading-mark');
      const retry = document.getElementById('focus-clock-retry');
      const timeout = window.setTimeout(() => {
        copy.textContent = 'Focus Clock belum berhasil dibuka.';
        mark.hidden = true;
        retry.hidden = false;
      }, 15000);

      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('flutter-first-frame', () => {
        window.clearTimeout(timeout);
        loading.remove();
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
