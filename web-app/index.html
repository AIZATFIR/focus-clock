<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Focus Clock — Simplicity First (3-Kolom & Tactile Dial)</title>
  <meta name="description" content="Visual time-blocking and abundant focus timer with 3-column Google Tasks simplicity, giant analog clock face, and emergency stop.">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Fonts: Outfit, Plus Jakarta Sans, & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Three.js-inspired 3D Ambient Spatial Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <div class="app-container">
    <!-- Top Header & Minimalist Tab Navigation -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">FC</div>
        <div class="brand-text-block">
          <span class="brand-title">Focus Clock</span>
          <span class="brand-subtitle">Simplicity First • Zen Timeblocking</span>
        </div>
      </div>

      <!-- Tab Navigation (Tombol 3 = Mode Primary!) -->
      <nav class="tab-nav">
        <button id="tab-btn-tasks" class="tab-btn">
          <span>📋 Tasks</span>
          <span class="tab-key-hint">1</span>
        </button>
        <button id="tab-btn-clock" class="tab-btn">
          <span>🕒 Clock Face</span>
          <span class="tab-key-hint">2</span>
        </button>
        <button id="tab-btn-timer" class="tab-btn active primary-tab">
          <span>⏱️ Focus Timer</span>
          <span class="primary-badge">PRIMARY</span>
          <span class="tab-key-hint">3</span>
        </button>
      </nav>
    </header>

    <!-- Main Views -->
    <main style="flex: 1; display: flex; flex-direction: column;">
      <!-- View 1: 3-Column Tasks (Apa, Dimana, Kapan) -->
      <section id="view-tasks" class="view-panel"></section>

      <!-- View 2: Giant Tactile Clock Face (12-Hour Classic Dial) -->
      <section id="view-clock" class="view-panel"></section>

      <!-- View 3: Zen Focus Timer (Primary Landing View) -->
      <section id="view-timer" class="view-panel active"></section>
    </main>

    <!-- Persistent Session Summary & Celebration Modal -->
    <div id="session-summary-modal" class="session-modal-overlay"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
